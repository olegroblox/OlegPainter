name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate all GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  windows:
    name: Windows / Python 3.13
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Validate PowerShell syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'dev.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors -join "`n") }
      - name: Set up locked development environment
        id: setup
        run: |
          # Use setup-python's interpreter; dev.ps1 setup reuses this venv.
          $env:OLEGPAINTER_VENV = Join-Path $env:RUNNER_TEMP 'olegpainter-venv'
          "OLEGPAINTER_VENV=$env:OLEGPAINTER_VENV" >> $env:GITHUB_ENV
          python -m venv "$env:OLEGPAINTER_VENV"
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          .\dev.ps1 setup
      - name: Check environment, Ruff and documentation
        run: .\dev.ps1 check
      - name: Run automated tests
        # A lint failure must not prevent us from reporting test failures as well.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: .\dev.ps1 test -m "not hardware and not desktop" --junitxml=test-results/pytest.xml
      - name: Upload pytest report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-windows-python313
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
