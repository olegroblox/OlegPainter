[pytest]
# Keep discovery inside the maintained suite, never old snapshots or builds.
testpaths = tests
pythonpath = .
addopts = -ra --strict-config --strict-markers
markers =
    hardware: requires an installed Interception driver and real input devices; manual only
    desktop: requires an interactive desktop, native capture or physical input; manual only
norecursedirs = _backup_* _proof_* */_backup_* build dist .git __pycache__ .pytest_cache models
